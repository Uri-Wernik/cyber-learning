<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">tls</title><desc id="desc">O navegador verifica nome, validade e cadeia do certificado durante o handshake TLS e estabelece chaves de sessão. Depois disso, HTTP viaja protegido. O certificado autentica o domínio apresentado, mas não certifica honestidade do conteúdo nem elimina metadados de rede.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">Proteger o transporte não certifica a honestidade da página</text><rect x="35" y="116" width="102" height="68" rx="7" fill="#dfecdf" stroke="#263b35" stroke-width="1.5"/><rect x="43" y="124" width="86" height="49" rx="7" fill="#fffef9" stroke="#263b35" stroke-width="1.5"/><path d="M55 139 L115 139" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M55 152 L105 152" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M35 184 l-12 14 h126 l-12 -14" fill="#e8e4d7" stroke="#263b35" stroke-width="2"/><text x="86" y="227" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">navegador</text><rect x="751" y="116" width="102" height="68" rx="7" fill="#dfecdf" stroke="#263b35" stroke-width="1.5"/><rect x="759" y="124" width="86" height="49" rx="7" fill="#fffef9" stroke="#263b35" stroke-width="1.5"/><path d="M771 139 L831 139" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M771 152 L821 152" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M751 184 l-12 14 h126 l-12 -14" fill="#e8e4d7" stroke="#263b35" stroke-width="2"/><text x="802" y="227" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">servidor</text><rect x="224" y="85" width="453" height="219" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="450" y="123" font-family="Arial, sans-serif" font-size="26" fill="#286957" text-anchor="middle">Handshake TLS</text><text x="450" y="164" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">nome + validade + cadeia do certificado</text><text x="450" y="203" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">estabelecimento de chaves de sessão</text><path d="M172 259 L728 259" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M718.3465918192059 264.2736809246462 L728 259 L718.3465918192059 253.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="246" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">HTTP protegido depois da negociação</text><text x="450" y="365" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">Conteúdo honesto e aplicação segura exigem outras verificações.</text></svg>