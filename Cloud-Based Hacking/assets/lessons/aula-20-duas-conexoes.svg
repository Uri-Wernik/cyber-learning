<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">duas conexoes</title><desc id="desc">No modelo conceitual de laboratório existem duas conexões TLS: navegador para proxy e proxy para aplicação controlada. O intermediário termina uma conexão e inicia a outra. A aplicação continua responsável por validar fatores e emitir a sessão; o modelo não representa uma quebra da criptografia TLS.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="125" y="35" font-family="Arial, sans-serif" font-size="24" fill="#286957" text-anchor="middle">Navegador</text><text x="445" y="35" font-family="Arial, sans-serif" font-size="24" fill="#286957" text-anchor="middle">Proxy do laboratório</text><text x="755" y="35" font-family="Arial, sans-serif" font-size="24" fill="#286957" text-anchor="middle">Aplicação controlada</text><rect x="22" y="60" width="210" height="148" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><rect x="36" y="77" width="182" height="32" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="127" y="99" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">domínio do proxy</text><text x="127" y="145" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">HTTP a enviar</text><text x="127" y="180" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">dentro de TLS</text><rect x="344" y="60" width="202" height="148" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="445" y="94" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">TLS recebido termina</text><path d="M366 110 L524 110" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><text x="445" y="140" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">mensagem HTTP</text><text x="445" y="171" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">novo cliente TLS</text><rect x="658" y="60" width="218" height="148" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="767" y="94" font-family="Arial, sans-serif" font-size="17" fill="#263b35" text-anchor="middle">seu domínio e certificado</text><path d="M680 110 L854 110" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><text x="767" y="141" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">valida os fatores</text><text x="767" y="175" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">emite a sessão</text><path d="M245 132 L331 132" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M321.3465918192059 137.27368092464624 L331 132 L321.3465918192059 126.72631907535377" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="288" y="114" font-family="Arial, sans-serif" font-size="19" fill="#286957" text-anchor="middle">TLS</text><path d="M559 132 L645 132" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M635.3465918192059 137.27368092464624 L645 132 L635.3465918192059 126.72631907535377" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="602" y="114" font-family="Arial, sans-serif" font-size="18" fill="#286957" text-anchor="middle">outro TLS</text><path d="M645 244 L559 244" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M568.6534081807941 238.72631907535376 L559 244 L568.6534081807941 249.27368092464624" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M331 244 L245 244" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M254.6534081807941 238.72631907535376 L245 244 L254.6534081807941 249.27368092464624" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="445" y="252" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">resposta HTTP</text><text x="127" y="252" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">recebe a resposta</text><text x="767" y="252" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">produz a resposta</text><path d="M445 216 L445 227" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><rect x="280" y="297" width="330" height="71" rx="7" fill="#e9e5d9" stroke="#97654f" stroke-width="1.5"/><text x="445" y="327" font-family="Arial, sans-serif" font-size="19" fill="#97654f" text-anchor="middle">O conteúdo é acessível no proxy:</text><text x="445" y="353" font-family="Arial, sans-serif" font-size="18" fill="#97654f" text-anchor="middle">ele é a ponta de cada conexão.</text></svg>