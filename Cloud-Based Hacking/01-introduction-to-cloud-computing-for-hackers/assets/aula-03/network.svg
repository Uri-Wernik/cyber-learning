<svg xmlns="http://www.w3.org/2000/svg" width="648" height="350" viewBox="0 0 648 350" role="img" aria-labelledby="title desc"><title id="title">network</title><desc id="desc">A LAN do cliente contém um notebook, um switch e um roteador de saída. Uma ligação ampliada embaixo mostra as redes intermediárias da Internet e o sentido de um pacote. À direita, outro roteador liga a uma rede com um servidor. A lista de serviços distingue Web por HTTP/HTTPS, e-mail e SSH. A ligação não representa uma única rede, um cabo direto entre casas ou uma topologia real de provedor.</desc><rect width="648" height="350" rx="9" fill="#FFF8EB"/><g transform="translate(24 24)"><text x="100" y="27" font-family="&apos;Segoe UI&apos;" font-size="18" fill="#286957" text-anchor="middle">LAN do cliente</text><text x="503" y="27" font-family="&apos;Segoe UI&apos;" font-size="18" fill="#286957" text-anchor="middle">rede do serviço</text><rect x="12" y="42" width="176" height="146" rx="3" fill="#FFFEF9" stroke="#A8BEAE" stroke-width="1.5"/><rect x="412" y="42" width="176" height="146" rx="3" fill="#FFFEF9" stroke="#A8BEAE" stroke-width="1.5"/><g transform="translate(34 59) scale(0.6)"><rect x="0" y="0" width="83" height="53" rx="2" fill="#DDEBE5" stroke="#263B35" stroke-width="1.5"/><rect x="6" y="6" width="71" height="39" rx="1" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><path d="M0 53 L-9 64 Q42 69 94 64 L83 53Z" fill="#E8E3D7" stroke="#263B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17 H65 M17 27 H52 M17 37 H59" fill="none" stroke="#286957" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="66" y="119" font-family="&apos;Segoe UI&apos;" font-size="15" fill="#263B35" text-anchor="middle">notebook</text><rect x="103" y="131" width="69" height="25" rx="3" fill="#DDEBE5" stroke="#263B35" stroke-width="1.5"/><rect x="110" y="139" width="6" height="8" rx="0" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><rect x="120" y=