<svg xmlns="http://www.w3.org/2000/svg" width="648" height="234" viewBox="0 0 648 234" role="img" aria-labelledby="title desc"><title id="title">scale</title><desc id="desc">Na escala vertical, a mesma VM passa a ter mais CPU e memória. Na horizontal, pedidos são divididos entre várias instâncias por um distribuidor. Armazenamento e dados continuam exigindo coordenação; mais ícones não garantem ganho proporcional.</desc><rect width="648" height="234" rx="9" fill="#FFF8EB"/><g transform="translate(24 24)"><text x="151" y="25" font-family="&apos;Segoe UI&apos;" font-size="20" fill="#286957" text-anchor="middle">vertical: a mesma VM</text><text x="450" y="25" font-family="&apos;Segoe UI&apos;" font-size="20" fill="#286957" text-anchor="middle">horizontal: várias VMs</text><rect x="23" y="43" width="113" height="93" rx="3" fill="none" stroke="#263B35" stroke-width="1.5"/><text x="79" y="66" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">antes</text><text x="79" y="97" font-family="&apos;Segoe UI&apos;" font-size="18" fill="#263B35" text-anchor="middle">CPU</text><text x="79" y="123" font-family="&apos;Segoe UI&apos;" font-size="18" fill="#263B35" text-anchor="middle">RAM</text><path d="M145 92 L164 92 M156.10175694298664 96.31482984743782 L164 92 L156.10175694298664 87.68517015256218" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="175" y="43" width="113" height="93" rx="3" fill="none" stroke="#263B35" stroke-width="1.5"/><text x="231" y="66" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">depois</text><text x="231" y="97" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">mais CPU</text><text x="231" y="123" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">mais RAM</text><text x="450" y="53" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">pedidos</text><path d="M450 60 L450 75 M445.6851701525622 67.10175694298664 L450 75 L454.3148298474378 67.10175694298664" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 76 V85 M338 85 H562" fill="none" stroke="#286957" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M338 85 L338 101 M333.6851701525622 93.10175694298664 L338 101 L342.3148298474378 93.10175694298664" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 85 L450 101 M445.6851701525622 93.10175694298664 L450 101 L454.3148298474378 93.10175694298664" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M562 85 L562 101 M557.6851701525621 93.10175694298664 L562 101 L566.3148298474379 93.10175694298664" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="308" y="110" width="62" height="38" rx="3" fill="#DFECE4" stroke="#286957" stroke-width="1.5"/><rect x="419" y="110" width="62" height="38" rx="3" fill="#DFECE4" stroke="#286957" stroke-width="1.5"/><rect x="530" y="110" width="62" height="38" rx="3" fill="#DFECE4" stroke="#286957" stroke-width="1.5"/><text x="339" y="136" font-family="&apos;Segoe UI&apos;" font-size="18" fill="#263B35" text-anchor="middle">VM</text><text x="450" y="136" font-family="&apos;Segoe UI&apos;" font-size="18" fill="#263B35" text-anchor="middle">VM</text><text x="561" y="136" font-family="&apos;Segoe UI&apos;" font-size="18" fill="#263B35" text-anchor="middle">VM</text><text x="151" y="175" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#263B35" text-anchor="middle">a capacidade muda</text><text x="450" y="175" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#263B35" text-anchor="middle">o trabalho é repartido</text></g></svg>