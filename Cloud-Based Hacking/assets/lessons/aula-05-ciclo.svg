<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">ciclo</title><desc id="desc">Parar a instância interrompe sua execução, mas o volume de armazenamento pode permanecer. Terminar a instância exige conferir separadamente volumes, snapshots, endereços e regras temporárias. Fechar a sessão SSH não realiza nenhuma dessas duas operações.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">Fechar o terminal não encerra os recursos</text><rect x="34" y="100" width="235" height="100" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="151.5" y="143.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Instância executando</text><text x="151.5" y="172.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">CPU, memória e disco</text><path d="M282 150 L408 150" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M398.3465918192059 155.27368092464624 L408 150 L398.3465918192059 144.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="345" y="129" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">parar</text><rect x="423" y="100" width="200" height="100" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="523.0" y="143.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Instância parada</text><text x="523.0" y="172.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">execução interrompida</text><path d="M523 215 L523 265" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M517.7263190753538 255.3465918192059 L523 265 L528.2736809246462 255.3465918192059" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="405" y="278" width="290" height="69" rx="7" fill="#e9e5d9" stroke="#286957" stroke-width="1.5"/><text x="550.0" y="319.5" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Volume pode permanecer</text><path d="M638 150 L673 150" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M663.3465918192059 155.27368092464624 L673 150 L663.3465918192059 144.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="655" y="85" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">terminar</text><rect x="687" y="100" width="178" height="100" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="776.0" y="143.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Terminada</text><text x="776.0" y="172.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">revisar recursos</text><text x="238" y="305" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">Conferir separadamente:</text><text x="238" y="335" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">volumes, snapshots e endereços</text></svg>