<svg xmlns="http://www.w3.org/2000/svg" width="648" height="292" viewBox="0 0 648 292" role="img" aria-labelledby="title desc"><title id="title">request</title><desc id="desc">Uma conexão TCP destinada à porta 443 atravessa a rede e o filtro. Na máquina de destino, o sistema entrega a conexão ao processo web que está em escuta. Depois de negociar TLS, o cliente pede GET /area e recebe a resposta HTTP pela conexão protegida.</desc><rect width="648" height="292" rx="9" fill="#FFF8EB"/><g transform="translate(24 24)"><text x="92" y="26" font-family="&apos;Segoe UI&apos;" font-size="19" fill="#286957" text-anchor="middle">cliente</text><g transform="translate(39 59) scale(0.85)"><rect x="0" y="0" width="83" height="53" rx="2" fill="#DDEBE5" stroke="#263B35" stroke-width="1.5"/><rect x="6" y="6" width="71" height="39" rx="1" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><path d="M0 53 L-9 64 Q42 69 94 64 L83 53Z" fill="#E8E3D7" stroke="#263B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17 H65 M17 27 H52 M17 37 H59" fill="none" stroke="#286957" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="290" y="26" font-family="&apos;Segoe UI&apos;" font-size="18" fill="#286957" text-anchor="middle">caminho de rede</text><rect x="181" y="88" width="69" height="25" rx="3" fill="#DDEBE5" stroke="#263B35" stroke-width="1.5"/><rect x="188" y="96" width="6" height="8" rx="0" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><rect x="198" y="96" width="6" height="8" rx="0" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><rect x="208" y="96" width="6" height="8" rx="0" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><rect x="218" y="96" width="6" height="8" rx="0" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><rect x="228" y="96" width="6" height="8" rx="0" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><rect x="294" y="63" width="55" height="78" rx="3" fill="#E9E5D9" stroke="#263B35" stroke-width