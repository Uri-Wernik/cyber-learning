<svg xmlns="http://www.w3.org/2000/svg" width="648" height="350" viewBox="0 0 648 350" role="img" aria-labelledby="title desc"><title id="title">conditions</title><desc id="desc">Três tentativas de conexão TCP/443 partem de clientes. No primeiro caso, uma regra bloqueia os pacotes antes do destino. No segundo, a regra permite a passagem, mas o sistema não encontra processo em escuta em TCP/443; não ocorre atendimento, mesmo que a rede permita a chegada. No terceiro, o processo web está em escuta e a conexão pode ser estabelecida. Depois de TCP e TLS, HTTP pode trocar pedido e resposta. Rota, endereço e os demais controles são pressupostos corretos nos três exemplos.</desc><rect width="648" height="350" rx="9" fill="#FFF8EB"/><g transform="translate(24 24)"><g transform="translate(26 28) scale(0.47)"><rect x="0" y="0" width="83" height="53" rx="2" fill="#DDEBE5" stroke="#263B35" stroke-width="1.5"/><rect x="6" y="6" width="71" height="39" rx="1" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><path d="M0 53 L-9 64 Q42 69 94 64 L83 53Z" fill="#E8E3D7" stroke="#263B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17 H65 M17 27 H52 M17 37 H59" fill="none" stroke="#286957" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="49" y="82" font-family="&apos;Segoe UI&apos;" font-size="15" fill="#263B35" text-anchor="middle">cliente</text><path d="M76 49 L115 49 M107.10175694298664 53.31482984743783 L115 49 L107.10175694298664 44.68517015256217" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="126" y="23" width="83" height="47" rx="3" fill="#EDF3E8" stroke="#286957" stroke-width="1.5"/><text x="167" y="43" font-family="&apos;Segoe UI&apos;" font-size="15" fill="#263B35" text-anchor="middle">regra</text><text x="167" y="62" font-family="&apos;Segoe UI&apos;" font-size="15" fill="#263B35" text-anchor="middle">bloqueia</text><rect x="270" y="13" width="314" height="86" rx="4" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><text x="313" y="35" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#286957" text-anchor="middle">TCP/443</text><path d="M211 49 H226 M228 32 V66" fill="none" stroke="#956650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="390" y="36" width="178" height="28" rx="3" fill="#DFECE4" stroke="#286957" stroke-width="1.5"/><text x="479" y="57" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#263B35" text-anchor="middle">web em escuta</text><text x="427" y="88" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#805A45" text-anchor="middle">pacotes não chegam</text><g transform="translate(26 128) scale(0.47)"><rect x="0" y="0" width="83" height="53" rx="2" fill="#DDEBE5" stroke="#263B35" stroke-width="1.5"/><rect x="6" y="6" width="71" height="39" rx="1" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><path d="M0 53 L-9 64 Q42 69 94 64 L83 53Z" fill="#E8E3D7" stroke="#263B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17 H65 M17 27 H52 M17 37 H59" fill="none" stroke="#286957" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="49" y="182" font-family="&apos;Segoe UI&apos;" font-size="15" fill="#263B35" text-anchor="middle">cliente</text><path d="M76 149 L115 149 M107.10175694298664 153.31482984743784 L115 149 L107.10175694298664 144.68517015256216" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="126" y="123" width="83" height="47" rx="3" fill="#EDF3E8" stroke="#286957" stroke-width="1.5"/><text x="167" y="143" font-family="&apos;Segoe UI&apos;" font-size="15" fill="#263B35" text-anchor="middle">regra</text><text x="167" y="162" font-family="&apos;Segoe UI&apos;" font-size="15" fill="#263B35" text-anchor="middle">permite</text><rect x="270" y="113" width="314" height="86" rx="4" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><text x="313" y="135" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#286957" text-anchor="middle">TCP/443</text><path d="M211 149 L258 149 M250.10175694298664 153.31482984743784 L258 149 L250.10175694298664 144.68517015256216" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M282 153 L354 153 M346.10175694298664 157.31482984743784 L354 153 L346.10175694298664 148.68517015256216" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M359 145 l13 15 m0 -15 l-13 15" fill="none" stroke="#956650" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="390" y="136" width="178" height="28" rx="3" fill="none" stroke="#9B8F7F" stroke-dasharray="5 4"/><text x="479" y="157" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#805A45" text-anchor="middle">nenhum processo</text><text x="427" y="188" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#805A45" text-anchor="middle">sem atendimento</text><g transform="translate(26 228) scale(0.47)"><rect x="0" y="0" width="83" height="53" rx="2" fill="#DDEBE5" stroke="#263B35" stroke-width="1.5"/><rect x="6" y="6" width="71" height="39" rx="1" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><path d="M0 53 L-9 64 Q42 69 94 64 L83 53Z" fill="#E8E3D7" stroke="#263B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17 H65 M17 27 H52 M17 37 H59" fill="none" stroke="#286957" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="49" y="282" font-family="&apos;Segoe UI&apos;" font-size="15" fill="#263B35" text-anchor="middle">cliente</text><path d="M76 249 L115 249 M107.10175694298664 253.31482984743784 L115 249 L107.10175694298664 244.68517015256216" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="126" y="223" width="83" height="47" rx="3" fill="#EDF3E8" stroke="#286957" stroke-width="1.5"/><text x="167" y="243" font-family="&apos;Segoe UI&apos;" font-size="15" fill="#263B35" text-anchor="middle">regra</text><text x="167" y="262" font-family="&apos;Segoe UI&apos;" font-size="15" fill="#263B35" text-anchor="middle">permite</text><rect x="270" y="213" width="314" height="86" rx="4" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><text x="313" y="235" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#286957" text-anchor="middle">TCP/443</text><path d="M211 249 L258 249 M250.10175694298664 253.31482984743784 L258 249 L250.10175694298664 244.68517015256216" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M282 253 L381 253 M373.10175694298664 257.3148298474378 L381 253 L373.10175694298664 248.68517015256216" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="390" y="236" width="178" height="28" rx="3" fill="#DFECE4" stroke="#286957" stroke-width="1.5"/><text x="479" y="257" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#263B35" text-anchor="middle">web em escuta</text><text x="427" y="288" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#286957" text-anchor="middle">HTTP somente após TCP e TLS</text></g></svg>