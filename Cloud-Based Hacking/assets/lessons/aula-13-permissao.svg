<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">permissao</title><desc id="desc">O SFTP autentica o usuário kali, mas a escrita também depende da propriedade e das permissões do diretório. Uma conexão pode funcionar e a criação do arquivo ser recusada. Alterar a propriedade e atualizar a listagem é diferente de enviar o arquivo.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">Identidade da conexão e permissão de escrita</text><rect x="40" y="105" width="220" height="84" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="150.0" y="140.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Sessão SFTP</text><text x="150.0" y="169.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">usuário kali autenticado</text><path d="M277 148 L410 148" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M400.3465918192059 153.27368092464624 L410 148 L400.3465918192059 142.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="343" y="127" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">tenta criar</text><rect x="426" y="77" width="433" height="246" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="642" y="114" font-family="Arial, sans-serif" font-size="26" fill="#286957" text-anchor="middle">/var/www/html</text><text x="642" y="155" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">proprietário | grupo | permissões</text><rect x="458" y="180" width="369" height="59" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="642.5" y="216.5" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">O sistema decide se permite</text><text x="642" y="280" font-family="Arial, sans-serif" font-size="21" fill="#97654f" text-anchor="middle">conexão válida ≠ escrita autorizada</text><text x="450" y="368" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">Alterar propriedade não realiza o upload do arquivo.</text></svg>