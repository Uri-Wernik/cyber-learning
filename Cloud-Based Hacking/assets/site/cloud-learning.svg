<svg xmlns="http://www.w3.org/2000/svg" width="648" height="328" viewBox="0 0 648 328" role="img" aria-labelledby="title desc"><title id="title">virtual</title><desc id="desc">Duas VMs possuem visões próprias de CPU, memória e disco. Setas partem do mesmo hipervisor para as duas VMs; abaixo dele estão processador, memória física e armazenamento do host. Os limites das VMs representam isolamento lógico, não gabinetes distintos.</desc><rect width="648" height="328" rx="9" fill="#FFF8EB"/><g transform="translate(24 24)"><rect x="18" y="12" width="258" height="112" rx="4" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><text x="147" y="39" font-family="&apos;Segoe UI&apos;" font-size="22" fill="#286957" text-anchor="middle">VM A</text><text x="147" y="64" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">sistema convidado</text><rect x="33" y="80" width="67" height="29" rx="3" fill="#DFECE4" stroke="#286957" stroke-width="1.5"/><rect x="112" y="80" width="67" height="29" rx="3" fill="#DFECE4" stroke="#286957" stroke-width="1.5"/><rect x="191" y="80" width="67" height="29" rx="3" fill="#E9E5D9" stroke="#263B35" stroke-width="1.5"/><text x="66" y="101" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#263B35" text-anchor="middle">CPU</text><text x="145" y="101" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#263B35" text-anchor="middle">RAM</text><text x="224" y="101" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#263B35" text-anchor="middle">disco</text><rect x="324" y="12" width="258" height="112" rx="4" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><text x="453" y="39" font-family="&apos;Segoe UI&apos;" font-size="22" fill="#286957" text-anchor="middle">VM B</text><text x="453" y="64" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">sistema convidado</text><rect x="339" y="80" width="67" height="29" rx="3" fill="#DFECE4" stroke="#286957" stroke-width="1.5"/><rec