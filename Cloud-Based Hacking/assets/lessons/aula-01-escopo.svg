<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">escopo</title><desc id="desc">O limite do laboratório separa ativos autorizados de sistemas de terceiros. A permissão define ativos, período e ações; somente as evidências permitidas retornam ao responsável. Acesso pela Internet não amplia esse limite.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">Permissão define o limite do exercício</text><rect x="32" y="72" width="540" height="235" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="302" y="104" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Dentro do laboratório</text><rect x="65" y="142" width="102" height="68" rx="7" fill="#dfecdf" stroke="#263b35" stroke-width="1.5"/><rect x="73" y="150" width="86" height="49" rx="7" fill="#fffef9" stroke="#263b35" stroke-width="1.5"/><path d="M85 165 L145 165" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M85 178 L135 178" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M65 210 l-12 14 h126 l-12 -14" fill="#e8e4d7" stroke="#263b35" stroke-width="2"/><text x="116" y="253" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">operador autorizado</text><path d="M193 183 L276 183" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M266.3465918192059 188.27368092464624 L276 183 L266.3465918192059 177.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="290" y="142" width="235" height="90" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="407.5" y="180.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Ativos aprovados</text><text x="407.5" y="209.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">ações e período definidos</text><path d="M289 267 L143 267" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M152.6534081807941 261.7263190753538 L143 267 L152.6534081807941 272.2736809246462" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="398" y="278" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">evidências permitidas</text><rect x="622" y="105" width="242" height="165" rx="7" fill="none" stroke="#97654f" stroke-width="1.5" stroke-dasharray="7 6"/><text x="743" y="157" font-family="Arial, sans-serif" font-size="23" fill="#97654f" text-anchor="middle">Terceiros</text><text x="743" y="191" font-family="Arial, sans-serif" font-size="20" fill="#97654f" text-anchor="middle">fora do escopo</text><path d="M597 155 L597 231" fill="none" stroke="#97654f" stroke-width="2.5" stroke-linecap="round"/><text x="450" y="358" font-family="Arial, sans-serif" font-size="22" fill="#263b35" text-anchor="middle">Estar na Internet não significa estar autorizado.</text></svg>