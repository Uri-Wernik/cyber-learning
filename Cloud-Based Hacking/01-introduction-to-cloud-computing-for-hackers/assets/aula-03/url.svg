<svg xmlns="http://www.w3.org/2000/svg" width="648" height="284" viewBox="0 0 648 284" role="img" aria-labelledby="title desc"><title id="title">url</title><desc id="desc">As partes de https://exemplo.test/area têm rótulos separados. Só o host exemplo.test é levado à consulta DNS; o caminho /area aparece na requisição HTTP ao servidor. O esquema https orienta o uso de transporte protegido.</desc><rect width="648" height="284" rx="9" fill="#FFF8EB"/><g transform="translate(24 24)"><text x="300" y="42" font-family="&apos;Segoe UI&apos;" font-size="29" fill="#286957" text-anchor="middle">https://exemplo.test/area</text><path d="M120 54 H206 M211 54 H411 M415 54 H480" fill="none" stroke="#7F9E8B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="161" y="83" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#263B35" text-anchor="middle">esquema</text><text x="307" y="83" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#263B35" text-anchor="middle">host</text><text x="456" y="83" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#263B35" text-anchor="middle">caminho</text><path d="M308 94 V113 H98 V135" fill="none" stroke="#286957" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="143" width="245" height="43" rx="3" fill="none" stroke="#286957" stroke-width="1.5"/><text x="139" y="169" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">DNS: exemplo.test → IP</text><path d="M457 94 V127 H439 V135" fill="none" stroke="#956650" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="309" y="143" width="277" height="43" rx="3" fill="none" stroke="#956650" stroke-width="1.5"/><text x="448" y="169" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">HTTP: pedir /area</text><text x="139" y="219" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#286957" text-anchor="middle">o nome é consultado</text><text x="448" y="219" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#805A45" text-anchor="middle">o caminho é solicitado</text></g></svg>