<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">decisao</title><desc id="desc">Receber uma mensagem, visitar uma página e realizar a ação esperada são observações diferentes. A passagem por uma etapa não comprova a seguinte. Uma simulação autorizada define antecipadamente qual evento inofensivo pode ser registrado, sem pedir senhas reais.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">Observar uma etapa não comprova a seguinte</text><rect x="53" y="109" width="102" height="68" rx="7" fill="#dfecdf" stroke="#263b35" stroke-width="1.5"/><rect x="61" y="117" width="86" height="49" rx="7" fill="#fffef9" stroke="#263b35" stroke-width="1.5"/><path d="M73 132 L133 132" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M73 145 L123 145" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M53 177 l-12 14 h126 l-12 -14" fill="#e8e4d7" stroke="#263b35" stroke-width="2"/><text x="104" y="220" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">mensagem recebida</text><rect x="399" y="109" width="102" height="68" rx="7" fill="#dfecdf" stroke="#263b35" stroke-width="1.5"/><rect x="407" y="117" width="86" height="49" rx="7" fill="#fffef9" stroke="#263b35" stroke-width="1.5"/><path d="M419 132 L479 132" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M419 145 L469 145" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M399 177 l-12 14 h126 l-12 -14" fill="#e8e4d7" stroke="#263b35" stroke-width="2"/><text x="450" y="220" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">página visitada</text><rect x="751" y="109" width="102" height="68" rx="7" fill="#dfecdf" stroke="#263b35" stroke-width="1.5"/><rect x="759" y="117" width="86" height="49" rx="7" fill="#fffef9" stroke="#263b35" stroke-width="1.5"/><path d="M771 132 L831 132" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M771 145 L821 145" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M751 177 l-12 14 h126 l-12 -14" fill="#e8e4d7" stroke="#263b35" stroke-width="2"/><text x="802" y="220" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">ação realizada</text><path d="M185 151 L359 151" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><path d="M537 151 L711 151" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><text x="272" y="130" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">depende de ação</text><text x="624" y="130" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">depende de ação</text><rect x="54" y="279" width="792" height="72" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="450" y="310" font-family="Arial, sans-serif" font-size="21" fill="#263b35" text-anchor="middle">A métrica do laboratório é definida antes do exercício.</text><text x="450" y="336" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">Sem senhas reais nem dados de participantes.</text></svg>