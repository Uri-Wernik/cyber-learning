 cx="44" cy="68" r="2.5" fill="#286957"/><path d="M7 92 H53" fill="none" stroke="#263B35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="546" y="190" font-family="&apos;Segoe UI&apos;" font-size="15" fill="#286957" text-anchor="middle">B: ativa</text><text x="278" y="39" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#286957" text-anchor="middle">verificação detecta A indisponível</text><path d="M467 229 H79" fill="none" stroke="#286957" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 229 L77 229 M84.89824305701336 224.68517015256216 L77 229 L84.89824305701336 233.31482984743784" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="289" y="254" font-family="&apos;Segoe UI&apos;" font-size="16" fill="#263B35" text-anchor="middle">resposta ao cliente por B</text></g></svg>