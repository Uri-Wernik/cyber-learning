<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">dns</title><desc id="desc">Sem uma resposta válida em cache, o cliente consulta um resolvedor recursivo. Ele localiza a zona responsável pela hierarquia DNS e consulta o autoritativo. A resposta contém dados e TTL; a conexão HTTP ao servidor ocorre depois, em um caminho diferente.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">A consulta DNS acontece antes da requisição web</text><rect x="32" y="93" width="102" height="68" rx="7" fill="#dfecdf" stroke="#263b35" stroke-width="1.5"/><rect x="40" y="101" width="86" height="49" rx="7" fill="#fffef9" stroke="#263b35" stroke-width="1.5"/><path d="M52 116 L112 116" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M52 129 L102 129" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M32 161 l-12 14 h126 l-12 -14" fill="#e8e4d7" stroke="#263b35" stroke-width="2"/><text x="83" y="204" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">cliente</text><path d="M152 135 L284 135" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M274.3465918192059 140.27368092464624 L284 135 L274.3465918192059 129.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="301" y="91" width="252" height="91" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="427.0" y="129.5" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Resolvedor recursivo</text><text x="427.0" y="158.5" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">consulta ou usa cache válido</text><path d="M571 135 L648 135" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M638.3465918192059 140.27368092464624 L648 135 L638.3465918192059 129.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="666" y="91" width="198" height="91" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="765.0" y="129.5" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Autoritativo</text><text x="765.0" y="158.5" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">registros da zona</text><text x="707" y="219" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">raiz e TLD ajudam</text><text x="707" y="244" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">a localizar a zona</text><path d="M648 166 L571 166" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M580.6534081807941 160.72631907535376 L571 166 L580.6534081807941 171.27368092464624" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M284 166 L153 166" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M162.6534081807941 160.72631907535376 L153 166 L162.6534081807941 171.27368092464624" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="426" y="235" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">resposta: dados + TTL</text><path d="M152 335 L648 335" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M638.3465918192059 340.2736809246462 L648 335 L638.3465918192059 329.7263190753538" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="456" y="319" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">depois: conexão com o servidor web</text></svg>