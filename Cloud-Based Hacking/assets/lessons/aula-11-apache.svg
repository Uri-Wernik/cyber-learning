<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">apache</title><desc id="desc">O caminho até uma página depende de uma regra de entrada permitir TCP 80 e de o Apache estar em escuta. Depois disso, o Apache interpreta o caminho solicitado e procura o recurso no document root. Abrir a regra não instala nem inicia o serviço.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">Do caminho de rede ao arquivo atendido</text><rect x="32" y="103" width="102" height="68" rx="7" fill="#dfecdf" stroke="#263b35" stroke-width="1.5"/><rect x="40" y="111" width="86" height="49" rx="7" fill="#fffef9" stroke="#263b35" stroke-width="1.5"/><path d="M52 126 L112 126" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M52 139 L102 139" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M32 171 l-12 14 h126 l-12 -14" fill="#e8e4d7" stroke="#263b35" stroke-width="2"/><text x="83" y="214" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">navegador</text><path d="M153 142 L286 142" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M276.3465918192059 147.27368092464624 L286 142 L276.3465918192059 136.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="121" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">TCP/80</text><rect x="301" y="103" width="164" height="82" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="383.0" y="137.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Regra</text><text x="383.0" y="166.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">permite a entrada</text><path d="M480 142 L551 142" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M541.3465918192059 147.27368092464624 L551 142 L541.3465918192059 136.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="568" y="80" width="296" height="243" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="716" y="113" font-family="Arial, sans-serif" font-size="21" fill="#286957" text-anchor="middle">Máquina de destino</text><rect x="596" y="144" width="240" height="70" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="716.0" y="186.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Apache em escuta</text><path d="M716 224 L716 252" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M710.7263190753538 242.3465918192059 L716 252 L721.2736809246462 242.3465918192059" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="716" y="282" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">document root → recurso</text><path d="M549 293 L141 293" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M150.6534081807941 287.7263190753538 L141 293 L150.6534081807941 298.2736809246462" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="276" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">resposta HTTP, inclusive 404</text><text x="450" y="368" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">Regra de rede e processo ativo resolvem condições diferentes.</text></svg>