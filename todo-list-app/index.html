<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Minha Lista de Tarefas</h1>
            <p class="subtitle">Mantenha suas tarefas organizadas</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Adicione uma nova tarefa..."
                    class="task-input"
                >
                <button id="addBtn" class="add-btn">Adicionar</button>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="active">Ativas</button>
                <button class="filter-btn" data-filter="completed">Concluídas</button>
            </div>
        </div>

        <div class="stats">
            <span>Total: <strong id="totalCount">0</strong></span>
            <span>Ativas: <strong id="activeCount">0</strong></span>
            <span>Concluídas: <strong id="completedCount">0</strong></span>
        </div>

        <ul id="taskList" class="task-list">
            <!-- As tarefas aparecem aqui -->
        </ul>

        <div class="empty-state" id="emptyState">
            <p>🎯 Nenhuma tarefa ainda. Comece adicionando uma!</p>
        </div>

        <div class="actions">
            <button id="clearCompletedBtn" class="clear-btn">Limpar Concluídas</button>
            <button id="exportBtn" class="export-btn">Exportar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
