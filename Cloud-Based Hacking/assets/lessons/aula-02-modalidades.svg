<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">modalidades</title><desc id="desc">Hacking ético contém modalidades autorizadas diferentes. O pentest investiga vulnerabilidades e comprova impactos delimitados; Red Team avalia uma sequência de ações orientada a objetivos. Ambos dependem de autorização, escopo e tratamento das evidências.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">Modalidades diferentes, limites em comum</text><rect x="34" y="72" width="832" height="238" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="450" y="110" font-family="Arial, sans-serif" font-size="24" fill="#286957" text-anchor="middle">Hacking ético: atividade autorizada</text><rect x="67" y="143" width="346" height="126" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="240.0" y="199.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Pentest</text><text x="240.0" y="228.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">vulnerabilidades e impactos</text><rect x="487" y="143" width="346" height="126" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="660.0" y="199.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Red Team</text><text x="660.0" y="228.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">sequência orientada a objetivos</text><text x="450" y="352" font-family="Arial, sans-serif" font-size="22" fill="#263b35" text-anchor="middle">Autorização + escopo + evidências protegidas</text></svg>