<svg xmlns="http://www.w3.org/2000/svg" width="648" height="315" viewBox="0 0 648 315" role="img" aria-labelledby="title desc"><title id="title">availability</title><desc id="desc">Uma verificação detecta que a instância A não responde; a rota até ela fica tracejada. A rota ativa do balanceador segue para B, com uma resposta de volta ao cliente. A disponibilidade ainda depende do balanceador, da rede e dos dados.</desc><rect width="648" height="315" rx="9" fill="#FFF8EB"/><g transform="translate(24 24)"><g transform="translate(26 69) scale(0.85)"><rect x="0" y="0" width="83" height="53" rx="2" fill="#DDEBE5" stroke="#263B35" stroke-width="1.5"/><rect x="6" y="6" width="71" height="39" rx="1" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><path d="M0 53 L-9 64 Q42 69 94 64 L83 53Z" fill="#E8E3D7" stroke="#263B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17 H65 M17 27 H52 M17 37 H59" fill="none" stroke="#286957" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M119 102 L190 102 M182.10175694298664 106.31482984743782 L190 102 L182.10175694298664 97.68517015256218" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="201" y="72" width="131" height="55" rx="3" fill="none" stroke="#286957" stroke-width="1.5"/><text x="266" y="105" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">balanceador</text><path d="M342 83 L439 47" fill="none" stroke="#9B7B66" stroke-width="1.4" stroke-dasharray="5 5"/><g transform="translate(453 12) scale(0.65)"><rect x="0" y="0" width="60" height="87" rx="3" fill="#E8F1EA" stroke="#263B35" stroke-width="1.5"/><rect x="7" y="9" width="46" height="18" rx="1" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><path d="M13 16 H33" fill="none" stroke="#286957" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="18" r="2.5" fill="#286957"/><rect x="7" y="34"