<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">instancia</title><desc id="desc">Uma AMI fornece o sistema inicial; o tipo de instância fornece CPU e memória; um volume EBS mantém os dados. A instância é o recurso em execução criado com essas escolhas. A chave privada permanece local e a chave pública participa do acesso inicial.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">A instância combina escolhas distintas</text><rect x="35" y="80" width="230" height="83" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="150.0" y="114.5" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">AMI</text><text x="150.0" y="143.5" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">sistema inicial</text><rect x="35" y="217" width="230" height="83" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="150.0" y="251.5" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Tipo de instância</text><text x="150.0" y="280.5" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">CPU, RAM e rede</text><path d="M277 122 L374 184" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M363.0259691454517 183.2445883218919 L374 184 L368.70636283333243 174.3575207779495" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M277 257 L374 217" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M367.08609217391063 225.55557587613714 L374 217 L363.0651308009123 215.8047445466163" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="389" y="111" width="240" height="190" rx="7" fill=