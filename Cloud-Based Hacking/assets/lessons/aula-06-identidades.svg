<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">identidades</title><desc id="desc">As permissões da conta AWS e as do sistema Linux são planos diferentes. IAM autoriza chamadas às APIs da AWS; o usuário Linux controla ações dentro da instância. A identidade root da conta não é o usuário root do Kali.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">Root da AWS não é root do Linux</text><rect x="34" y="74" width="832" height="125" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><rect x="58" y="98" width="215" height="76" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="165.5" y="129.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Identidade AWS</text><text x="165.5" y="158.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">root ou identidade IAM</text><path d="M290 135 L520 135" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M510.3465918192059 140.27368092464624 L520 135 L510.3465918192059 129.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="405" y="116" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">políticas IAM</text><rect x="538" y="98" width="300" height="76" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="688.0" y="143.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">APIs e recursos da conta</text><rect x="34" y="234" width="832" height="125" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><rect x="58" y="258" width="215" height="76" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="165.5" y="289.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Usuário Linux</text><text x="165.5" y="318.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">kali ou root</text><path d="M290 295 L520 295" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M510.3465918192059 300.2736809246462 L520 295 L510.3465918192059 289.7263190753538" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="405" y="276" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">permissões do sistema</text><rect x="538" y="258" width="300" height="76" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="688.0" y="303.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Processos e arquivos</text></svg>