<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">registros</title><desc id="desc">Um registro A relaciona um nome a um IPv4. Um CNAME declara um alias para outro nome, cujo endereço ainda precisa ser resolvido. Nenhum dos registros cria um redirecionamento HTTP ou inicia o servidor web.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">Nomes, aliases e endereços não são a mesma coisa</text><rect x="35" y="94" width="220" height="84" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="145.0" y="129.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Nome do laboratório</text><text x="145.0" y="158.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">example.test</text><path d="M272 135 L572 135" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M562.3465918192059 140.27368092464624 L572 135 L562.3465918192059 129.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="421" y="114" font-family="Arial, sans-serif" font-size="22" fill="#263b35" text-anchor="middle">A → endereço</text><rect x="589" y="94" width="274" height="84" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="726.0" y="129.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">IPv4 de documentação</text><text x="726.0" y="158.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">192.0.2.10</text><rect x="35" y="249" width="220" height="84" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="145.0" y="284.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Alias</text><text x="145.0" y="313.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">portal.example.test</text><path d="M272 291 L572 291" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M562.3465918192059 296.2736809246462 L572 291 L562.3465918192059 285.7263190753538" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="421" y="270" font-family="Arial, sans-serif" font-size="22" fill="#263b35" text-anchor="middle">CNAME → outro nome</text><rect x="589" y="249" width="274" height="84" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="726.0" y="284.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Nome canônico</text><text x="726.0" y="313.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">example.test</text><text x="450" y="378" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">DNS responde com dados; um redirecionamento vem do HTTP.</text></svg>