<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">sessao</title><desc id="desc">Antes de validar todos os fatores, a aplicação ainda não emitiu uma sessão autenticada. Depois da validação, um token pode representar esse estado nas requisições seguintes. A aplicação verifica validade e outros controles; revogar a sessão interrompe sua aceitação. O fluxo completo permanece não reproduzido neste workspace.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="137" y="36" font-family="Arial, sans-serif" font-size="23" fill="#286957" text-anchor="middle">Antes da validação</text><text x="452" y="36" font-family="Arial, sans-serif" font-size="23" fill="#286957" text-anchor="middle">Decisão da aplicação</text><text x="766" y="36" font-family="Arial, sans-serif" font-size="23" fill="#286957" text-anchor="middle">Depois da validação</text><rect x="83" y="70" width="102" height="68" rx="7" fill="#dfecdf" stroke="#263b35" stroke-width="1.5"/><rect x="91" y="78" width="86" height="49" rx="7" fill="#fffef9" stroke="#263b35" stroke-width="1.5"/><path d="M103 93 L163 93" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M103 106 L153 106" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M83 138 l-12 14 h126 l-12 -14" fill="#e8e4d7" stroke="#263b35" stroke-width="2"/><text x="134" y="181" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">fatores apresentados</text><path d="M222 122 L320 122" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M310.3465918192059 127.27368092464623 L320 122 L310.3465918192059 116.72631907535377" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="335" y="64" width="236" height="145" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="453" y="98" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">confere os fatores</text><text x="453" y="138" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">recusa ou aceita</text><text x="453" y="179" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">só aceita → cria sessão</text><path d="M586 122 L649 122" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M639.3465918192059 127.27368092464623 L649 122 L639.3465918192059 116.72631907535377" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="664" y="64" width="213" height="145" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="770" y="97" font-family="Arial, sans-serif" font-size="21" fill="#286957" text-anchor="middle">sessão no serviço</text><rect x="684" y="119" width="171" height="39" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="769" y="145" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">token sintético</text><text x="770" y="184" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">representa o estado</text><path d="M769 224 L769 252" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M769 252 L569 252" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M578.6534081807941 246.72631907535376 L569 252 L578.6534081807941 257.2736809246462" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="663" y="283" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">novo pedido com o token</text><rect x="335" y="234" width="218" height="118" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="444" y="266" font-family="Arial, sans-serif" font-size="21" fill="#286957" text-anchor="middle">servidor verifica</text><text x="444" y="302" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">validade e vínculos</text><text x="444" y="333" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">permite ou recusa</text><text x="136" y="262" font-family="Arial, sans-serif" font-size="20" fill="#97654f" text-anchor="middle">Ter uma senha</text><text x="136" y="294" font-family="Arial, sans-serif" font-size="20" fill="#97654f" text-anchor="middle">não comprova</text><text x="136" y="326" font-family="Arial, sans-serif" font-size="19" fill="#97654f" text-anchor="middle">sessão autenticada.</text></svg>