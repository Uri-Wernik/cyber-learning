    <text x="551" y="50" font-size="23">Nuvem, mas com infraestrutura real</text>
    <text x="176" y="539" font-size="22">Aprender e testar</text>
    <text x="176" y="569" font-size="19">somente com autorização</text>
    <text x="450" y="626" font-size="20">Conectar, verificar, compreender</text>
