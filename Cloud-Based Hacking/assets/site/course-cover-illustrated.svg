<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Um laboratório para entender a segurança na nuvem</title>
  <desc id="desc">Composição original em tinta verde sobre papel bege. Um notebook com terminal se conecta, através de um controle de rede, a um datacenter desenhado em perspectiva. Uma nuvem representa a administração por software, sem esconder os servidores físicos. Uma chave protegida, um caderno de evidências e uma conexão de retorno representam acesso autorizado e documentação. Não há números nem dados reais.</desc>
