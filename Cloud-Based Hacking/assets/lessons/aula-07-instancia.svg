 x="529" y="177" width="72" height="60" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="565.0" y="214.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">RAM</text><rect x="677" y="148" width="185" height="91" rx="7" fill="#e9e5d9" stroke="#286957" stroke-width="1.5"/><text x="769.5" y="186.5" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Volume EBS</text><text x="769.5" y="215.5" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">dados persistentes</text><path d="M642 194 L665 194" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M655.3465918192059 199.27368092464624 L665 194 L655.3465918192059 188.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="352" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">Key pair: pública na configuração; privada fica local.</text></svg>