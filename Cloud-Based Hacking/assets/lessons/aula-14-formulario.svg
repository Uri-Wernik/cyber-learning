<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">formulario</title><desc id="desc">O navegador mantém os campos no DOM. Em um envio nativo, action escolhe o destino, method escolhe o método e name identifica cada valor. Um processador no servidor teria de receber e tratar a requisição. O exemplo do laboratório cancela o envio no navegador e usa somente dados fictícios.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">Os atributos descrevem o envio; o código decide o efeito</text><rect x="34" y="75" width="350" height="248" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="209" y="112" font-family="Arial, sans-serif" font-size="24" fill="#286957" text-anchor="middle">Navegador / DOM</text><text x="209" y="158" font-family="Arial, sans-serif" font-size="22" fill="#263b35" text-anchor="middle">action → destino</text><text x="209" y="196" font-family="Arial, sans-serif" font-size="22" fill="#263b35" text-anchor="middle">method → método</text><text x="209" y="234" font-family="Arial, sans-serif" font-size="22" fill="#263b35" text-anchor="middle">name → chave do valor</text><path d="M400 171 L544 171" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M534.3465918192059 176.27368092464624 L544 171 L534.3465918192059 165.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="472" y="150" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">envio nativo</text><rect x="561" y="109" width="302" height="113" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="712.0" y="158.5" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Processador no servidor</text><text x="712.0" y="187.5" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">recebe e valida a requisição</text><path d="M394 280 L543 280" fill="none" stroke="#97654f" stroke-width="2.5" stroke-linecap="round"/><path d="M533 265 L533 295" fill="none" stroke="#97654f" stroke-width="2.5" stroke-linecap="round"/><text x="706" y="287" font-family="Arial, sans-serif" font-size="20" fill="#97654f" text-anchor="middle">exemplo: envio cancelado</text><text x="450" y="369" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">POST não cifra dados. O transporte protegido depende de TLS.</text></svg>