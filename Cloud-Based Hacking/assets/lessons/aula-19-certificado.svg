<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">certificado</title><desc id="desc">Na validação HTTP-01, a autoridade certificadora busca uma resposta temporária no domínio pela porta 80. Após comprovar controle, emite o certificado que o Apache apresenta em HTTPS na porta 443. A chave privada fica no servidor e a renovação precisa ser testada.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">A validação do domínio e o atendimento HTTPS têm etapas próprias</text><rect x="35" y="91" width="245" height="91" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="157.5" y="129.5" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Autoridade certificadora</text><text x="157.5" y="158.5" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">verifica o desafio</text><path d="M296 137 L581 137" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M571.3465918192059 142.27368092464624 L581 137 L571.3465918192059 131.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="438" y="117" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">HTTP-01 / TCP 80</text><rect x="597" y="91" width="267" height="263" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="730" y="125" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Apache + Certbot</text><text x="730" y="162" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">resposta temporária no domínio</text><path d="M297 246 L583 246" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M573.3465918192059 251.27368092464624 L583 246 L573.3465918192059 240.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="229" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">certificado emitido após validar</text><rect x="35" y="285" width="245" height="69" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="157.5" y="326.5" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Navegador</text><path d="M296 319 L581 319" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M571.3465918192059 324.2736809246462 L581 319 L571.3465918192059 313.7263190753538" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="439" y="301" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">HTTPS / TCP 443</text><text x="728" y="290" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">chave privada no servidor</text><text x="728" y="326" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">renovação precisa ser testada</text></svg>