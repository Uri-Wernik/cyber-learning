<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">estados</title><desc id="desc">Código-fonte baixado, binário compilado, processo em escuta e configuração validada são estados diferentes. Cada transição exige evidência própria. DNS correto, por exemplo, não comprova que o processo esteja ativo ou que TLS tenha sido validado.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="137" y="36" font-family="Arial, sans-serif" font-size="23" fill="#286957" text-anchor="middle">Arquivos do projeto</text><text x="453" y="36" font-family="Arial, sans-serif" font-size="23" fill="#286957" text-anchor="middle">Programa produzido</text><text x="767" y="36" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Programa em execução</text><rect x="45" y="63" width="180" height="154" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><rect x="64" y="81" width="142" height="33" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="135" y="104" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">código-fonte</text><rect x="64" y="128" width="142" height="33" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="135" y="151" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">Makefile</text><text x="135" y="193" font-family="Arial, sans-serif" font-size="17" fill="#263b35" text-anchor="middle">fonte da construção</text><path d="M240 134 L339 134" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M329.3465918192059 139.27368092464624 L339 134 L329.3465918192059 128.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="289" y="115" font-family="Arial, sans-serif" font-size="20" fill="#286957" text-anchor="middle">make</text><rect x="353" y="63" width="200" height="154" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="453" y="105" font-family="Arial, sans-serif" font-size="23" fill="#286957" text-anchor="middle">build/evilginx</text><text x="453" y="145" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">executável no disco</text><text x="453" y="184" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">não atende sozinho</text><path d="M568 134 L659 134" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M649.3465918192059 139.27368092464624 L659 134 L649.3465918192059 128.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="613" y="114" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">iniciar</text><rect x="675" y="63" width="186" height="154" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="768" y="102" font-family="Arial, sans-serif" font-size="20" fill="#286957" text-anchor="middle">processo ativo</text><text x="768" y="140" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">logs e escuta</text><text x="768" y="181" font-family="Arial, sans-serif" font-size="17" fill="#263b35" text-anchor="middle">conferir no sistema</text><path d="M453 231 L453 264" fill="none" stroke="#97654f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><rect x="300" y="278" width="306" height="82" rx="7" fill="#e9e5d9" stroke="#97654f" stroke-width="1.5"/><text x="453" y="310" font-family="Arial, sans-serif" font-size="21" fill="#97654f" text-anchor="middle">Configuração persistente</text><text x="453" y="340" font-family="Arial, sans-serif" font-size="18" fill="#97654f" text-anchor="middle">não é apagada ao recompilar</text><text x="140" y="297" font-family="Arial, sans-serif" font-size="20" fill="#286957" text-anchor="middle">DNS e TLS:</text><text x="140" y="329" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">outros testes</text><text x="765" y="298" font-family="Arial, sans-serif" font-size="20" fill="#286957" text-anchor="middle">Phishlets:</text><text x="765" y="329" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">arquivos de regras</text></svg>