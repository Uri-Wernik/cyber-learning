<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">chaves ssh</title><desc id="desc">Duas provas diferentes participam do SSH. O cliente verifica a chave de host para reconhecer o servidor. O servidor verifica uma assinatura do usuário com a chave pública autorizada. As duas chaves privadas permanecem em seus respectivos lados; não são enviadas pela rede.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">Duas verificações, duas chaves privadas protegidas</text><rect x="35" y="76" width="330" height="245" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><rect x="535" y="76" width="330" height="245" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="200" y="111" font-family="Arial, sans-serif" font-size="23" fill="#286957" text-anchor="middle">Cliente local</text><text x="700" y="111" font-family="Arial, sans-serif" font-size="23" fill="#286957" text-anchor="middle">Servidor SSH</text><text x="700" y="162" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">chave privada de host</text><path d="M523 183 L377 183" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M386.6534081807941 177.72631907535376 L377 183 L386.6534081807941 188.27368092464624" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="167" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">prova</text><text x="200" y="204" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">verifica a identidade do servidor</text><text x="200" y="253" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">chave privada do usuário</text><path d="M377 272 L523 272" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M513.3465918192059 277.2736809246462 L523 272 L513.3465918192059 266.7263190753538" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="256" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">assinatura</text><text x="700" y="294" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">verifica a chave autorizada</text><text x="450" y="367" font-family="Arial, sans-serif" font-size="21" fill="#263b35" text-anchor="middle">A rede recebe provas; não recebe as chaves privadas.</text></svg>