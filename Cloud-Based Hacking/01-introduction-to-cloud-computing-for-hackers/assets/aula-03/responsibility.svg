<svg xmlns="http://www.w3.org/2000/svg" width="408" height="408" viewBox="0 0 408 408" role="img" aria-labelledby="title desc"><title id="title">responsibility</title><desc id="desc">Um recorte de camadas de uma VM mostra datacenter, hardware e hipervisor sob administração do provedor. Sistema convidado, aplicação, permissões e dados são tarefas do cliente. A divisão é específica desse exemplo, não de todos os serviços gerenciados.</desc><rect width="408" height="408" rx="9" fill="#FFF8EB"/><g transform="translate(24 24)"><text x="180" y="29" font-family="&apos;Segoe UI&apos;" font-size="21" fill="#286957" text-anchor="middle">Exemplo: máquina virtual</text><text x="24" y="65" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#286957" text-anchor="start">cliente administra</text><rect x="24" y="78" width="311" height="39" rx="3" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><text x="180" y="104" font-family="&apos;Segoe UI&apos;" font-size="19" fill="#263B35" text-anchor="middle">dados e aplicação</text><rect x="24" y="123" width="311" height="39" rx="3" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><text x="180" y="149" font-family="&apos;Segoe UI&apos;" font-size="19" fill="#263B35" text-anchor="middle">sistema convidado</text><text x="24" y="196" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#286957" text-anchor="start">provedor administra</text><rect x="24" y="210" width="311" height="38" rx="3" fill="#DFECE4" stroke="#286957" stroke-width="1.5"/><text x="180" y="236" font-family="&apos;Segoe UI&apos;" font-size="19" fill="#263B35" text-anchor="middle">hipervisor</text><rect x="24" y="254" width="311" height="38" rx="3" fill="#E9E5D9" stroke="#263B35" stroke-width="1.5"/><text x="180" y="280" font-family="&apos;Segoe UI&apos;" font-size="19" fill="#263B35" text-anchor="middle">hardware e instalação</text><text x="180" y="333" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#286957" text-anchor="middle">acesso e dados exigem configuração</text></g></svg>