<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">callback</title><desc id="desc">Em uma conexão direta, o testador inicia a comunicação com um serviço do laboratório. Em um callback, um agente já executado no laboratório inicia a saída para o controle autorizado. Filtros e rotas continuam necessários nos dois casos, e o canal não aumenta os privilégios do agente.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">Quem inicia a conexão muda; os limites permanecem</text><text x="58" y="98" font-family="Arial, sans-serif" font-size="21" fill="#286957" text-anchor="start">Conexão direta</text><rect x="42" y="120" width="210" height="74" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="147.0" y="164.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Testador</text><path d="M266 155 L578 155" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M568.3465918192059 160.27368092464624 L578 155 L568.3465918192059 149.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="136" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">solicita ao serviço</text><rect x="594" y="120" width="256" height="74" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="722.0" y="164.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Serviço do laboratório</text><text x="58" y="239" font-family="Arial, sans-serif" font-size="21" fill="#286957" text-anchor="start">Callback</text><rect x="42" y="260" width="210" height="74" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="147.0" y="304.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Controle autorizado</text><path d="M578 295 L266 295" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M275.6534081807941 289.7263190753538 L266 295 L275.6534081807941 300.2736809246462" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="276" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">agente inicia a saída</text><rect x="594" y="260" width="256" height="74" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="722.0" y="304.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Agente já executado</text><text x="450" y="378" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">Rede, permissão e privilégios continuam necessários.</text></svg>