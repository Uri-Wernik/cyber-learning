<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">php</title><desc id="desc">Apache encaminha uma requisição ao interpretador PHP. A execução usa a identidade do processo web, não a identidade da sessão SFTP. A escrita em arquivo e a resposta HTTP são saídas distintas; o exemplo seguro registra um evento fictício, nunca o conteúdo dos campos.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">O processo web escreve e responde com sua própria identidade</text><rect x="34" y="92" width="200" height="84" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="134.0" y="127.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Apache</text><text x="134.0" y="156.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">recebe a requisição</text><path d="M250 134 L359 134" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M349.3465918192059 139.27368092464624 L359 134 L349.3465918192059 128.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="376" y="92" width="226" height="84" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="489.0" y="127.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">PHP no servidor</text><text x="489.0" y="156.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">processa o evento fictício</text><path d="M620 134 L676 134" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M666.3465918192059 139.27368092464624 L676 134 L666.3465918192059 128.72631907535376" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="691" y="92" width="174" height="84" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="778.0" y="127.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Arquivo</text><text x="778.0" y="156.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">escrita permitida?</text><path d="M776 192 L776 222" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><text x="776" y="252" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">propriedade</text><text x="776" y="282" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">e permissões</text><path d="M488 193 L488 277" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M482.7263190753538 267.3465918192059 L488 277 L493.2736809246462 267.3465918192059" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="281" y="292" width="414" height="63" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="488.0" y="330.5" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Resposta HTTP para o navegador</text><text x="197" y="242" font-family="Arial, sans-serif" font-size="19" fill="#97654f" text-anchor="middle">Usuário SFTP ≠ processo web</text></svg>