<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">transferencia</title><desc id="desc">O FileZilla envia arquivos por SFTP dentro do SSH, normalmente em TCP 22. O navegador solicita conteúdo ao Apache por outro protocolo e outra porta. Um upload para o diretório pessoal não publica automaticamente a página no document root.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">Transferir um arquivo não é o mesmo que publicá-lo</text><rect x="35" y="84" width="240" height="90" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="155.0" y="122.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">FileZilla no Windows</text><text x="155.0" y="151.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">cliente SFTP</text><path d="M291 130 L585 130" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M575.3465918192059 135.27368092464624 L585 130 L575.3465918192059 124.72631907535377" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="438" y="110" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">SSH / TCP 22</text><rect x="602" y="84" width="260" height="90" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="732.0" y="122.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Usuário no Kali</text><text x="732.0" y="151.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">grava onde tem permissão</text><rect x="35" y="241" width="240" height="90" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="155.0" y="279.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Navegador</text><text x="155.0" y="308.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">cliente HTTP</text><path d="M291 286 L585 286" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M575.3465918192059 291.2736809246462 L585 286 L575.3465918192059 280.7263190753538" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="438" y="267" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">HTTP / TCP 80</text><rect x="602" y="241" width="260" height="90" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="732.0" y="279.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">Apache</text><text x="732.0" y="308.0" font-family="Arial, sans-serif" font-size="18" fill="#263b35" text-anchor="middle">lê o conteúdo publicado</text><path d="M732 187 L732 226" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/><text x="450" y="378" font-family="Arial, sans-serif" font-size="20" fill="#263b35" text-anchor="middle">O destino do upload precisa ser escolhido e conferido.</text></svg>