<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">comando</title><desc id="desc">Na linha ls -la /var/www/html, ls escolhe o programa, -la reúne opções e o caminho é o argumento sobre o qual ele trabalha. A shell interpreta a linha e inicia o programa. Em uma sessão SSH, essa execução acontece na máquina remota.</desc><rect width="900" height="400" rx="12" fill="#fff8eb"/><text x="450" y="42" font-family="Arial, sans-serif" font-size="25" fill="#286957" text-anchor="middle">A linha digitada tem partes com funções diferentes</text><rect x="53" y="81" width="794" height="95" rx="7" fill="#fffef9" stroke="#286957" stroke-width="1.5"/><text x="122" y="143" font-family="Arial, sans-serif" font-size="38" fill="#286957" text-anchor="middle">ls</text><text x="291" y="143" font-family="Arial, sans-serif" font-size="38" fill="#286957" text-anchor="middle">-la</text><text x="588" y="143" font-family="Arial, sans-serif" font-size="38" fill="#286957" text-anchor="middle">/var/www/html</text><path d="M85 187 L160 187" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M232 187 L353 187" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><path d="M426 187 L791 187" fill="none" stroke="#286957" stroke-width="2.5" stroke-linecap="round"/><text x="122" y="227" font-family="Arial, sans-serif" font-size="21" fill="#263b35" text-anchor="middle">programa</text><text x="291" y="227" font-family="Arial, sans-serif" font-size="21" fill="#263b35" text-anchor="middle">opções</text><text x="588" y="227" font-family="Arial, sans-serif" font-size="21" fill="#263b35" text-anchor="middle">argumento</text><text x="291" y="258" font-family="Arial, sans-serif" font-size="19" fill="#263b35" text-anchor="middle">-l e -a</text><rect x="211" y="294" width="478" height="66" rx="7" fill="#dfecdf" stroke="#286957" stroke-width="1.5"/><text x="450.0" y="334.0" font-family="Arial, sans-serif" font-size="22" fill="#286957" text-anchor="middle">A shell interpreta e inicia o programa</text></svg>