<svg xmlns="http://www.w3.org/2000/svg" width="408" height="408" viewBox="0 0 408 408" role="img" aria-labelledby="title desc"><title id="title">provision</title><desc id="desc">O cliente pede uma instância ao Console ou à API. A resposta do provisionamento é um recurso com processamento, memória, disco e rede; criar a instância não significa que um site já esteja rodando.</desc><rect width="408" height="408" rx="9" fill="#FFF8EB"/><g transform="translate(24 24)"><g transform="translate(28 27) scale(0.72)"><rect x="0" y="0" width="83" height="53" rx="2" fill="#DDEBE5" stroke="#263B35" stroke-width="1.5"/><rect x="6" y="6" width="71" height="39" rx="1" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><path d="M0 53 L-9 64 Q42 69 94 64 L83 53Z" fill="#E8E3D7" stroke="#263B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17 H65 M17 27 H52 M17 37 H59" fill="none" stroke="#286957" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="94" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">cliente</text><path d="M96 54 L142 54 M134.10175694298664 58.31482984743783 L142 54 L134.10175694298664 49.68517015256217" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="224" y="44" font-family="&apos;Segoe UI&apos;" font-size="21" fill="#286957" text-anchor="middle">Console / API</text><text x="224" y="72" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">criar instância</text><path d="M221 91 V112 H176" fill="none" stroke="#286957" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M176 112 L176 134 M171.68517015256216 126.10175694298664 L176 134 L180.31482984743784 126.10175694298664" fill="none" stroke="#286957" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="37" y="147" width="286" height="166" rx="4" fill="#FFFEF9" stroke="#263B35" stroke-width="1.5"/><text x="180" y="174" font-family="&apos;Segoe UI&apos;" font-size="20" fill="#286957" text-anchor="middle">instância criada</text><rect x="55" y="191" width="110" height="40" rx="3" fill="#DFECE4" stroke="#286957" stroke-width="1.5"/><rect x="193" y="191" width="110" height="40" rx="3" fill="#E9E5D9" stroke="#263B35" stroke-width="1.5"/><text x="109" y="217" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">CPU e RAM</text><text x="249" y="217" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">disco</text><path d="M180 187 V275" fill="none" stroke="#BACABD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="256" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">sistema</text><text x="249" y="256" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">rede</text><text x="180" y="291" font-family="&apos;Segoe UI&apos;" font-size="17" fill="#263B35" text-anchor="middle">não é um site pronto</text></g></svg>